spring:
  application:
    name: interview-agent
  # 调用大模型是慢 IO（一次几秒到几十秒），用虚拟线程避免 Tomcat 线程池被占满
  threads:
    virtual:
      enabled: true
  # 错误响应统一用 RFC 9457 ProblemDetail 格式
  mvc:
    problemdetails:
      enabled: true
  # 简历 PDF 上传大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    model:
      # 当前生效的对话模型：openai 或 anthropic
      # openai 指任何 OpenAI 兼容接口，默认连 DeepSeek，也可以连通义千问等
      chat: ${AI_PROVIDER:openai}
      # 向量化模型，同样走 OpenAI 兼容接口。DeepSeek 没有 embedding 接口，默认用通义千问
      embedding: openai
      # 暂不使用的能力先关掉，避免 OpenAI starter 在没配 key 时启动失败
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

    openai:
      chat:
        api-key: ${CHAT_API_KEY:}
        base-url: ${CHAT_BASE_URL:https://api.deepseek.com}
        options:
          model: ${CHAT_MODEL:deepseek-chat}
          # deepseek-chat 单次最多输出 8K token，评估报告比较长，默认的 4K 可能不够
          max-tokens: 8000
      embedding:
        api-key: ${EMBEDDING_API_KEY:}
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v4}
          # 底层 SDK 默认要求返回 base64 格式，部分兼容接口只支持 float，这里显式指定
          encoding-format: float

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-opus-5}
          max-tokens: 16000

    vectorstore:
      pgvector:
        # 启动时自动创建 vector 扩展和向量表
        initialize-schema: true
        # 用题目 ID（如 jvm-001）做主键，默认要求 UUID
        id-type: TEXT
        # 必须和 embedding 模型输出的维度一致；换模型后维度变了，要先删掉旧表 vector_store
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE

interview:
  # 主问题数量（追问不计），写进系统提示词，由模型把控节奏
  max-questions: 6
  # 单场面试最多回答次数，防止对话无限进行、成本失控
  max-answers: 30
  # 对话记忆保留的最近消息条数
  memory-max-messages: 200
  rag:
    # 最终返回给模型的题目数量
    top-k: 5
    # 向量检索、关键词检索各召回多少条候选；融合后最多这么多条交给 rerank
    candidates: 20
    # 每次调用 embedding 接口最多提交的文本条数，通义千问 text-embedding-v4 限制为 10
    embedding-batch-size: 10
    rerank:
      enabled: ${RERANK_ENABLED:true}
      # 默认用百炼的 qwen3-rerank，Key 默认复用 EMBEDDING_API_KEY
      url: ${RERANK_URL:https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
      api-key: ${RERANK_API_KEY:${EMBEDDING_API_KEY:}}
      model: ${RERANK_MODEL:qwen3-rerank}
      # 超时后放弃重排序，直接用混合检索的结果
      timeout: 5s

logging:
  level:
    # 改成 DEBUG 可以看到每次发给模型的完整请求和响应（SimpleLoggerAdvisor）
    org.springframework.ai.chat.client.advisor: INFO
    # 改成 DEBUG 可以看到每次检索各步骤的结果（向量召回、关键词召回、融合、rerank）
    com.interviewagent.questionbank.QuestionRetriever: INFO
